name: Перевірки

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  windows-edge-agent:
    name: Перевірки Windows-вузла
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/Watcher.EdgeAgent.Service.IntegrationTests/Watcher.EdgeAgent.Service.IntegrationTests.csproj
      - run: dotnet test tests/Watcher.EdgeAgent.Service.IntegrationTests/Watcher.EdgeAgent.Service.IntegrationTests.csproj -c Release --no-restore -p:RunWindowsIntegrationTests=true --logger "trx;LogFileName=windows-edge-agent.trx"
      - name: Перевірити автозапуск Windows-вузла
        shell: pwsh
        run: ./tests/scripts/test_edge_agent_startup_registration.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-edge-agent-tests
          path: tests/Watcher.EdgeAgent.Service.IntegrationTests/TestResults/**/*.trx
          if-no-files-found: ignore

  build:
    name: Збірка Watcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Перевірити Docker-образ
        run: docker build -t kgta-alert:ci .
      - name: Перевірити звіт CI
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore KgtaAlert.slnx
      - run: dotnet build KgtaAlert.slnx -c Release --no-restore
      - run: dotnet test KgtaAlert.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - run: node --test tests/ui/*.test.js
      - name: Unit-тести з покриттям
        id: unit-tests
        run: dotnet test tests/Watcher.UnitTests/Watcher.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=unit-coverage.trx" --collect:"XPlat Code Coverage" --settings coverlet.runsettings
      - name: Показати покриття модулів
        if: success() && steps.unit-tests.outcome == 'success'
        run: >-
          python3 scripts/ci/coverage_summary.py
          --label "Unit-тести"
          --coverage-glob "tests/Watcher.UnitTests/TestResults/**/coverage.cobertura.xml"
      - name: Unit-тести Core та Infrastructure Edge Agent (70%)
        id: edge-agent-tests
        run: dotnet test tests/Watcher.EdgeAgent.UnitTests/Watcher.EdgeAgent.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=edge-agent-coverage.trx" --collect:"XPlat Code Coverage" --settings coverlet.edge-agent.runsettings
      - name: Показати покриття Core та Infrastructure Edge Agent
        if: success() && steps.edge-agent-tests.outcome == 'success'
        run: >-
          python3 scripts/ci/coverage_summary.py
          --label "Core та Infrastructure Edge Agent (поріг 70%)"
          --coverage-glob "tests/Watcher.EdgeAgent.UnitTests/TestResults/**/coverage.cobertura.xml"
          --minimum-line-coverage 70
      - run: dotnet format KgtaAlert.slnx --verify-no-changes
      - run: dotnet list KgtaAlert.slnx package --vulnerable --include-transitive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-and-coverage
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  validate-compose:
    name: Перевірка Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Перевірити синтаксис Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Перевірити Compose із mTLS listener
        env:
          DEVICE_SERVER_CERTIFICATE_FILE: /tmp/device-server.pfx
          DEVICE_SERVER_CERTIFICATE_PASSWORD_FILE: /tmp/device-server-password
          DEVICE_CLIENT_CA_CERTIFICATE_FILE: /tmp/device-ca.crt
        run: docker compose --env-file .env.example -f compose.yaml -f compose.mtls.yaml config --quiet

  documentation:
    name: Перевірка посилань у документації
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Перевірити внутрішні посилання в Markdown
        shell: bash
        run: |
          missing=0
          while IFS= read -r target; do
            path="${target%%#*}"
            [ -z "$path" ] || [ -e "$path" ] || { echo "Не знайдено: $path"; missing=1; }
          done < <(grep -rhoE '\]\((docs/[^)#]+|README\.md|AGENTS\.md)#[^)]*\)|\]\((docs/[^)]+|README\.md|AGENTS\.md)\)' --include='*.md' . | sed -E 's/.*\]\(([^)#]+).*/\1/' | sort -u)
          exit "$missing"

  postgres-migrations:
    name: Перевірка міграцій PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: kgta_alert
          POSTGRES_USER: kgta_alert
          POSTGRES_PASSWORD: local-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kgta_alert -d kgta_alert"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ConnectionStrings__Watcher: Host=localhost;Port=5432;Database=kgta_alert;Username=kgta_alert;Password=local-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global dotnet-ef --version 10.0.4
      - run: dotnet restore KgtaAlert.slnx
      - run: dotnet ef database update --project src/Watcher.Infrastructure --startup-project src/Watcher.Api
      - name: PostgreSQL-тести з покриттям
        id: postgres-tests
        run: dotnet test tests/Watcher.Api.IntegrationTests/Watcher.Api.IntegrationTests.csproj -c Release --filter "TestArea=PostgreSQL" --logger "trx;LogFileName=postgres-integration.trx" --collect:"XPlat Code Coverage" --settings coverlet.postgres.runsettings
      - name: Перевірити виконання PostgreSQL-тестів і показати покриття
        if: success() && steps.postgres-tests.outcome == 'success'
        run: >-
          python3 scripts/ci/coverage_summary.py
          --label "PostgreSQL integration"
          --coverage-glob "tests/Watcher.Api.IntegrationTests/TestResults/**/coverage.cobertura.xml"
          --trx-glob "tests/Watcher.Api.IntegrationTests/TestResults/**/*.trx"
          --require-postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgresql-integration-coverage
          path: tests/Watcher.Api.IntegrationTests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  combined-coverage:
    name: Объединённое покрытие модулей (70%)
    needs: [build, postgres-migrations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-results-and-coverage
          path: coverage-artifacts/unit-and-edge-agent
      - uses: actions/download-artifact@v4
        with:
          name: postgresql-integration-coverage
          path: coverage-artifacts/postgresql
      - name: Проверить объединённое покрытие production-модулей
        run: >-
          python3 scripts/ci/coverage_union.py
          --coverage-glob "coverage-artifacts/**/coverage.cobertura.xml"
          --minimum-module-line-coverage 70
          --required-module Watcher.Api
          --required-module Watcher.Contracts
          --required-module Watcher.Domain
          --required-module Watcher.Infrastructure
          --required-module Watcher.EdgeAgent.Contracts
          --required-module Watcher.EdgeAgent.Core
          --required-module Watcher.EdgeAgent.Infrastructure

  publish-image:
    name: Публікація контейнера
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, validate-compose, documentation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
