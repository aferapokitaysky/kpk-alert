name: Проверки

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate-compose:
    name: Проверка Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить синтаксис Compose
        run: docker compose --env-file .env.example config --quiet

  documentation:
    name: Проверка ссылок документации
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Перевірити внутрішні посилання в Markdown
        shell: bash
        run: |
          missing=0
          while IFS= read -r target; do
            path="${target%%#*}"
            [ -z "$path" ] || [ -e "$path" ] || { echo "Не знайдено: $path"; missing=1; }
          done < <(grep -rhoE '\]\((docs/[^)#]+|README\.md|AGENTS\.md)#[^)]*\)|\]\((docs/[^)]+|README\.md|AGENTS\.md)\)' --include='*.md' . | sed -E 's/.*\]\(([^)#]+).*/\1/' | sort -u)
          exit "$missing"
